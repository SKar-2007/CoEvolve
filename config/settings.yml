# REFERENCE ONLY — not loaded by the app. Runtime config lives in .env -> packages/api/config.py.
# CoEvolve Main Settings

app:
  name: "CoEvolve Sandbox"
  version: "0.1.0"
  environment: "development"  # development, staging, production

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

database:
  url: "sqlite:///coevolve.db"
  echo: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/coevolve.log"

security:
  secret_key: "${COEVOLVE_SECRET_KEY}"
  token_expiry: 3600
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
