[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests", "packages/judge/dast/targets/vulnerable_app_java"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast unit tests",
    "integration: Requires Docker or external services",
    "e2e: Full end-to-end scenarios",
]
addopts = "-q"

[tool.coverage.run]
source = ["packages"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true