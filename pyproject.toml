[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coevolve"
version = "0.1.0"
description = "CoEvolve — Adversarial Training as a Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
]

[project.scripts]
coevolve = "packages.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "UP042"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests", "packages/judge/dast/targets/vulnerable_app_java"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast unit tests",
    "integration: Requires Docker or external services",
    "e2e: Full end-to-end scenarios",
]
addopts = "-q"
