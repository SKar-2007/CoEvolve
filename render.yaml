# Backing services are NOT provisioned here on purpose: free-tier database
# plans come and go. Use managed Postgres (Supabase/Neon/Render) + managed
# Redis (Upstash/Render Key Value) and paste the URLs into the sync:false
# env vars below. See DEPLOY.md "Deploy to Render" for the full checklist.
# If your plan supports them, you can add:
#
# databases:
#   - name: coevolve-db
#     plan: starter
# keyValue:
#   - name: coevolve-redis
#     plan: starter
#
# ...and wire DATABASE_URL / REDIS_URL via fromDatabase / fromService
# properties instead of sync:false.
services:
  - type: web
    name: coevolve-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn packages.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: modelscope
      - key: LLM_MODEL
        value: Qwen/Qwen3-30B-A3B
      - key: MODELSCOPE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # P0 production security defaults — set the sync:false values in the
      # Render dashboard before deploying.
      - key: REQUIRE_AUTH
        value: true
      - key: API_KEY_STORE
        value: db
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
    healthCheckPath: /health
