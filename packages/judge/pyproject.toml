[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coevolve-judge"
version = "0.1.0"
description = "Hybrid Judge Engine (SAST + DAST) for CoEvolve Sandbox"
requires-python = ">=3.11"
dependencies = [
    "coevolve-sandbox>=0.1.0",
    "pydantic>=2.7",
    "semgrep>=1.80",
]

[tool.setuptools]
packages = ["judge", "judge.sast", "judge.dast"]

[tool.setuptools.package-data]
"judge" = ["sast/semgrep_rules/*.yml"]