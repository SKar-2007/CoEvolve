rules:
  - id: python.requests.security.ssrf
    message: >
      Unvalidated user-controlled URL passed to an HTTP client. Validate the
      scheme (http/https only), block internal/reserved ranges, and never follow
      redirects to internal addresses.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-918"]
      owasp: ["A10:2021"]
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: requests.get($URL)
          - pattern: requests.post($URL)
          - pattern: urllib.request.urlopen($URL)
          - pattern: aiohttp.request(...)