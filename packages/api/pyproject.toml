[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coevolve-api"
version = "0.1.0"
description = "REST API for CoEvolve Sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[tool.setuptools]
packages = ["api"]
package-dir = { api = "." }

[tool.setuptools.package-data]
"api" = ["static/*.html"]