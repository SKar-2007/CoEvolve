[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coevolve-evolution"
version = "0.1.0"
description = "Prompt-Evolution Engine for CoEvolve Sandbox"
requires-python = ">=3.11"
dependencies = [
    "coevolve-agents>=0.1.0",
    "pydantic>=2.7",
]

[tool.setuptools]
packages = ["evolution"]