[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coevolve-agents"
version = "0.1.0"
description = "Agent implementations for CoEvolve Sandbox"
requires-python = ">=3.11"
dependencies = [
    "coevolve-elo>=0.1.0",
    "anthropic>=0.30",
    "openai>=1.30",
    "pydantic>=2.7",
]

[tool.setuptools]
packages = [
    "agents",
    "agents.attacker",
    "agents.developer",
    "agents.distiller",
    "agents.regression_guard",
]