# Prometheus configuration for CoEvolve Sandbox.
# Scrapes the API service for /metrics (prometheus-client exposition format).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "coevolve-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "coevolve-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
