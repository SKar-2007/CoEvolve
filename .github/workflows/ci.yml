name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check packages/ tests/
      - run: ruff format --check packages/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy pydantic pydantic-settings sqlalchemy
      - run: mypy packages/ --ignore-missing-imports --explicit-package-bases

  security:
    name: Security (secrets + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install detect-secrets==1.5.* pip-audit==2.10.*
      - name: Fail on new secrets vs baseline
        run: detect-secrets scan --baseline .secrets.baseline
      - name: Fail on known dependency vulnerabilities
        run: pip-audit -r requirements.txt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/unit/ -v --tb=short -q

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/integration/ -v --tb=short -q -m "not integration"

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/ --cov=packages --cov-report=term-missing --cov-report=xml -q
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # JavaScript DAST Target
  # ---------------------------------------------------------------------------
  js-dast-build:
    name: JS DAST Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Verify Node.js vulnerable app starts
        run: |
          node packages/judge/dast/targets/vulnerable_app_js.js --port 3999 &
          sleep 2
          curl -sf http://127.0.0.1:3999/ > /dev/null
          curl -sf "http://127.0.0.1:3999/search?name=admin" | grep -q "admin"
          curl -sf "http://127.0.0.1:3999/xss?q=test" | grep -q "Search results"
          kill %1 || true

  # ---------------------------------------------------------------------------
  # Java Spring Boot DAST Target
  # ---------------------------------------------------------------------------
  java-dast-build:
    name: Java DAST Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Spring Boot app
        run: mvn package -q -DskipTests -f packages/judge/dast/targets/vulnerable_app_java/pom.xml
      - name: Verify Spring Boot app starts
        run: |
          java -jar packages/judge/dast/targets/vulnerable_app_java/target/vulnapp-1.0.0.jar &
          # Wait for Spring Boot to start (up to 90s)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/internal/metadata > /dev/null 2>&1; then
              echo "Spring Boot started after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:8080/search?name=admin" | grep -q "admin"
          curl -sf "http://127.0.0.1:8080/xss?q=test" | grep -q "Search results"
          curl -sf "http://127.0.0.1:8080/internal/metadata" | grep -q "instance-id"
          kill %1 || true

  # ---------------------------------------------------------------------------
  # DAST Integration (all 3 languages)
  # ---------------------------------------------------------------------------
  dast-integration:
    name: DAST Integration (Python)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Run Python DAST verification
        run: python -m packages.judge.dast.runner --lang python
