name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install detect-secrets
      - run: detect-secrets scan --all-files --exclude-files '\.env$' --exclude-files '\.prompt_store/' --exclude-files 'stress_test.*\.json$' --exclude-files 'benchmark_report\.json$' > .secrets.baseline
      - name: Check for new secrets
        run: |
          NEW_SECRETS=$(python -c "
          import json
          with open('.secrets.baseline') as f:
              data = json.load(f)
          results = data.get('results', {})
          total = sum(len(v) for v in results.values())
          print(total)
          ")
          echo "Found $NEW_SECRETS secret(s)"
          if [ "$NEW_SECRETS" -gt 0 ]; then
            echo "::warning::Found $NEW_SECRETS potential secret(s). Review .secrets.baseline"
          fi

  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit --strict --progress-spinner

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"
